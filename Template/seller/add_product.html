{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">

                Add New Product

            </h2>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">

                        Product Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Category

                    </label>

                    <select
                        class="form-select"
                        name="category"
                        required
                    >

                        <option value="Painting">Painting</option>

                        <option value="Handicraft">Handicraft</option>

                        <option value="Jewelry">Jewelry</option>

                        <option value="Pottery">Pottery</option>

                        <option value="Wooden Art">Wooden Art</option>

                        <option value="Traditional Wear">Traditional Wear</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea
                        class="form-control"
                        rows="5"
                        name="description"
                    ></textarea>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">

                            Price

                        </label>

                        <input
                            type="number"
                            class="form-control"
                            name="price"
                            required
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Stock

                        </label>

                        <input
                            type="number"
                            class="form-control"
                            name="stock"
                            required
                        >

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">

                        Product Image

                    </label>

                    <input
                        type="file"
                        class="form-control"
                        name="image"
                        required
                    >

                </div>

                <button
                    class="btn btn-warning mt-4"
                    type="submit"
                >

                    Add Product

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
